name: bambu_rfid
description: Minimal Android Flutter app for reading Bambu Lab filament RFID tags.
publish_to: 'none'
repository: https://github.com/5Breeze/BambuRFID
version: 1.6.2+10

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bamburfid_logo.png
    - assets/spool_base.png
    - assets/spool_color_luma.png
